<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KasLite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #111827;
    --paper: #f9fafb;
    --paper2: #f3f4f6;
    --accent: #10b981;
    --expense: #ef4444;
    --muted: #6b7280;
    --border: #e5e7eb;
    --card: #ffffff;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --radius: 12px;
  }
  .dark {
    --ink: #f9fafb;
    --paper: #111827;
    --paper2: #1f2937;
    --accent: #34d399;
    --expense: #f87171;
    --muted: #9ca3af;
    --border: #374151;
    --card: #1f2937;
    --shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .anim-up { animation: fadeUp 0.3s ease-out both; }
  .anim-in { animation: fadeIn 0.2s ease-out both; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .btn-primary {
    background: var(--ink); color: var(--paper); border: 2px solid var(--ink);
    border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: 13px;
    cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink); background: var(--paper2); }

  .input-field {
    width: 100%; background: var(--paper2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink);
    outline: none; transition: border-color 0.15s;
  }
  .input-field:focus { border-color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
  }

  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 200; background: var(--ink); color: var(--paper);
    padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15); animation: slideIn 0.3s cubic-bezier(0.34,1.2,0.64,1) both;
    max-width: calc(100vw - 48px);
  }

  .tab-bar { display:flex; gap:4px; background:var(--paper2); padding:4px; border-radius:10px; border:1px solid var(--border); width:fit-content; }
  .tab-btn {
    padding:8px 16px; font-size:12px; font-weight:600; border-radius:7px; color:var(--muted);
    cursor:pointer; transition:all .15s; border:none; background:transparent; display:inline-flex; align-items:center; gap:6px;
  }
  .tab-btn.active { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1); }

  .chip {
    display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px;
    font-size:10px; font-weight:700; background:var(--paper2); color:var(--muted); border:1px solid var(--border);
    white-space:nowrap;
  }

  .list-row {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; background:var(--paper2); border-radius:8px; border:1px solid var(--border);
  }

  .lock-screen {
    position: fixed; inset: 0; background: var(--paper); z-index: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.6';

const html = htm.bind(h);

const GAS_TEMPLATE = `// Gunakan ini pada Google Apps Script (script.new)
// v2: mendukung kolom Kategori & Dompet, plus mode sinkronisasi "merge" (gabung by ID)
function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
    var mode = data.mode || 'overwrite';
    var HEADERS = ["ID", "Tanggal", "Keterangan", "Jenis", "Kategori", "Dompet", "Nominal", "Timestamp"];

    if (mode === 'merge') {
      // Gabung berdasarkan ID: baris yang sudah ada di Sheet tapi tidak dikirim dari
      // frontend akan TETAP dipertahankan (aman kalau Sheet juga diedit manual).
      var existing = sheet.getDataRange().getValues();
      var map = {};
      for (var i = 1; i < existing.length; i++) {
        if (existing[i][0]) map[existing[i][0]] = existing[i];
      }
      (data.txs || []).forEach(function(t) {
        map[t.id] = [t.id, t.tanggal, t.keterangan, t.jenis, t.kategori || '', t.wallet || '', t.nominal, t.createdAt];
      });
      sheet.clear();
      sheet.appendRow(HEADERS);
      sheet.getRange(1, 1, 1, HEADERS.length).setFontWeight("bold");
      var mergedRows = Object.keys(map).map(function(k) { return map[k]; });
      if (mergedRows.length) sheet.getRange(2, 1, mergedRows.length, HEADERS.length).setValues(mergedRows);
    } else {
      // Mode Sinkronisasi Total (Frontend adalah master)
      sheet.clear();
      sheet.appendRow(HEADERS);
      sheet.getRange(1, 1, 1, HEADERS.length).setFontWeight("bold");
      if (data.txs && data.txs.length > 0) {
        var rows = data.txs.map(function(t) {
          return [t.id, t.tanggal, t.keterangan, t.jenis, t.kategori || '', t.wallet || '', t.nominal, t.createdAt];
        });
        sheet.getRange(2, 1, rows.length, HEADERS.length).setValues(rows);
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ok: true})).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({error: err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  var data = sheet.getDataRange().getValues();
  var txs = [];
  // Mulai dari indeks 1 untuk melewati Header
  for(var i = 1; i < data.length; i++) {
    if(data[i][0]) {
      txs.push({
        id: data[i][0], tanggal: data[i][1], keterangan: data[i][2], jenis: data[i][3],
        kategori: data[i][4] || '', wallet: data[i][5] || '',
        nominal: Number(data[i][6]), createdAt: data[i][7]
      });
    }
  }
  return ContentService.createTextOutput(JSON.stringify({txs: txs})).setMimeType(ContentService.MimeType.JSON);
}`;

// ─── LOCAL STORAGE WRAPPER ───
const LS = {
  get: (k, fallback = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ─── KONSTANTA ───
const DEFAULT_CATEGORIES = ['Gaji','Bonus','Hadiah','Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan','Pendidikan','Lainnya'];

// ─── HELPER ───
function simpleHash(s) {
  // Bukan kriptografi asli — cuma agar PIN tidak tersimpan sebagai teks polos.
  // Data transaksi tetap tersimpan apa adanya di localStorage.
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h.toString(36);
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  return lines.slice(1).map(line => {
    const cells = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (inQuotes) {
        if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else cur += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { cells.push(cur); cur = ''; }
        else cur += c;
      }
    }
    cells.push(cur);
    return cells;
  });
}

const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);

// ─── TOAST (mendukung tombol aksi, mis. "URUNGKAN") ───
function Toast({ msg, type, action }) {
  const isErr = type === 'err';
  return html`
    <div class="toast" style=${{ background: isErr ? 'var(--expense)' : 'var(--ink)' }}>
      ${isErr ? html`<${I.X} style=${{width:14,height:14,flexShrink:0}} />` : html`<${I.Check} style=${{width:14,height:14,flexShrink:0}} />`}
      <span>${msg}</span>
      ${action && html`
        <button onClick=${action.onClick} style=${{ background:'rgba(255,255,255,0.2)', border:'none', color:'inherit', borderRadius:6, padding:'2px 8px', fontSize:12, fontWeight:700, cursor:'pointer', marginLeft:4, flexShrink:0 }}>
          ${action.label}
        </button>
      `}
    </div>
  `;
}

// ─── GRAFIK TREN (SVG bar chart, tanpa dependency) ───
function TrendChart({ data }) {
  const max = Math.max(1, ...data.map(d => Math.max(d.masuk, d.keluar)));
  const w = 600, h = 180, barW = 18;
  const gap = (w - data.length * barW * 2) / (data.length + 1);
  return html`
    <svg viewBox="0 0 ${w} ${h}" style=${{ width:'100%', height:'auto', overflow:'visible' }}>
      ${data.map((d, i) => {
        const x = gap + i * (barW * 2 + gap);
        const hMasuk = (d.masuk / max) * (h - 30);
        const hKeluar = (d.keluar / max) * (h - 30);
        return html`
          <g key=${d.key}>
            <rect x=${x} y=${h - 20 - hMasuk} width=${barW} height=${hMasuk} rx="3" fill="var(--accent)" />
            <rect x=${x + barW} y=${h - 20 - hKeluar} width=${barW} height=${hKeluar} rx="3" fill="var(--expense)" />
            <text x=${x + barW} y=${h - 4} text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>
          </g>
        `;
      })}
    </svg>
  `;
}

// ─── DONUT KATEGORI (SVG stroke-dasharray, tanpa dependency) ───
function CategoryDonut({ data }) {
  if (!data.length) return html`<p style=${{ fontSize:13, color:'var(--muted)', textAlign:'center', padding:'20px 0' }}>Belum ada pengeluaran bulan ini.</p>`;
  let cumulative = 0;
  return html`
    <div style=${{ display:'flex', alignItems:'center', gap:20, flexWrap:'wrap' }}>
      <svg viewBox="0 0 120 120" style=${{ width:120, height:120, flexShrink:0, transform:'rotate(-90deg)' }}>
        ${data.map((c, i) => {
          const el = html`<circle cx="60" cy="60" r="45" fill="none" stroke=${PALETTE[i % PALETTE.length]} stroke-width="18" stroke-dasharray="${c.pct} ${100 - c.pct}" stroke-dashoffset=${-cumulative} pathLength="100" />`;
          cumulative += c.pct;
          return el;
        })}
      </svg>
      <div style=${{ flex:1, minWidth:160, display:'flex', flexDirection:'column', gap:6 }}>
        ${data.map((c, i) => html`
          <div key=${c.kategori} style=${{ display:'flex', alignItems:'center', gap:8, fontSize:12 }}>
            <span style=${{ width:10, height:10, borderRadius:3, background:PALETTE[i % PALETTE.length], flexShrink:0 }}></span>
            <span style=${{ flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${c.kategori}</span>
            <span style=${{ fontWeight:700, flexShrink:0 }}>${c.pct.toFixed(0)}%</span>
          </div>
        `)}
      </div>
    </div>
  `;
}

// ─── RINGKASAN BULAN INI VS BULAN LALU ───
function MonthCompareCard({ cur, prev }) {
  const delta = (curVal, prevVal) => prevVal ? ((curVal - prevVal) / prevVal) * 100 : null;
  const dMasuk = delta(cur.masuk, prev.masuk);
  const dKeluar = delta(cur.keluar, prev.keluar);
  const renderDelta = (d, goodIfUp) => {
    if (d === null) return html`<span style=${{ fontSize:11, color:'var(--muted)' }}>Baru</span>`;
    const up = d >= 0;
    const good = goodIfUp ? up : !up;
    return html`
      <span style=${{ fontSize:11, fontWeight:700, color: good ? 'var(--accent)' : 'var(--expense)', display:'inline-flex', alignItems:'center', gap:2 }}>
        ${up ? html`<${I.ArrowUp} style=${{width:10,height:10}}/>` : html`<${I.ArrowDown} style=${{width:10,height:10}}/>`}
        ${Math.abs(d).toFixed(0)}% vs bulan lalu
      </span>
    `;
  };
  return html`
    <div class="card" style=${{ padding:16, display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
      <div>
        <div style=${{ fontSize:11, color:'var(--muted)', fontWeight:600, textTransform:'uppercase', marginBottom:4 }}>Pemasukan Bulan Ini</div>
        <div style=${{ fontSize:18, fontWeight:700 }}>${formatRp(cur.masuk)}</div>
        ${renderDelta(dMasuk, true)}
      </div>
      <div>
        <div style=${{ fontSize:11, color:'var(--muted)', fontWeight:600, textTransform:'uppercase', marginBottom:4 }}>Pengeluaran Bulan Ini</div>
        <div style=${{ fontSize:18, fontWeight:700 }}>${formatRp(cur.keluar)}</div>
        ${renderDelta(dKeluar, false)}
      </div>
    </div>
  `;
}

function App() {
  // ── Tema ──
  const [dark, setDark] = useState(() => LS.get('kas_theme') === 'dark');
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    LS.set('kas_theme', dark ? 'dark' : 'light');
  }, [dark]);

  // ── Kunci PIN ──
  const [pinHash, setPinHash] = useState(() => LS.get('kas_pin', null));
  const [unlocked, setUnlocked] = useState(() => !LS.get('kas_pin', null));
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState(false);
  const [newPinInput, setNewPinInput] = useState('');

  // ── Data inti ──
  const [txs, setTxs] = useState(() => LS.get('kas_txs', []));
  const [categories, setCategories] = useState(() => LS.get('kas_categories', DEFAULT_CATEGORIES));
  const [wallets, setWallets] = useState(() => LS.get('kas_wallets', DEFAULT_WALLETS));
  const [recurring, setRecurring] = useState(() => LS.get('kas_recurring', []));

  // ── Cloud sync ──
  const [syncUrl, setSyncUrl] = useState(() => LS.get('kas_syncUrl', ''));
  const [syncMode, setSyncMode] = useState(() => LS.get('kas_syncMode', 'overwrite'));
  const [isSyncing, setIsSyncing] = useState(false);

  // ── Filter & tampilan ──
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('Semua');
  const [filterWallet, setFilterWallet] = useState('Semua');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [sortBy, setSortBy] = useState('tanggal');
  const [sortDir, setSortDir] = useState('desc');
  const [showAdvFilter, setShowAdvFilter] = useState(false);
  const [activeTab, setActiveTab] = useState('transaksi');

  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const [modal, setModal] = useState(null);
  const [editingId, setEditingId] = useState(null);

  const emptyForm = { tanggal: new Date().toISOString().split('T')[0], keterangan: '', jenis: 'Pemasukan', kategori: '', wallet: wallets[0] || 'Tunai', nominal: '' };
  const [form, setForm] = useState(emptyForm);
  const [tempUrl, setTempUrl] = useState('');
  const [showGasInfo, setShowGasInfo] = useState(false);
  const [newWalletName, setNewWalletName] = useState('');

  const emptyRecurringForm = { keterangan: '', jenis: 'Pengeluaran', kategori: '', wallet: wallets[0] || 'Tunai', nominal: '', dayOfMonth: '1' };
  const [recurringForm, setRecurringForm] = useState(emptyRecurringForm);

  const notify = useCallback((msg, type = 'ok', action = null) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, type, action });
    toastTimer.current = setTimeout(() => setToast(null), action ? 5000 : 3000);
  }, []);

  // ── Migrasi data lama + jalankan transaksi berulang yang jatuh tempo (sekali saat app dibuka) ──
  useEffect(() => {
    let workingTxs = txs;
    let changed = false;

    if (workingTxs.some(t => t.kategori === undefined || t.wallet === undefined)) {
      workingTxs = workingTxs.map(t => ({
        ...t,
        kategori: t.kategori || 'Lainnya',
        wallet: t.wallet || (wallets[0] || 'Tunai')
      }));
      changed = true;
    }

    const today = new Date();
    const periodKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
    const due = recurring.filter(r => r.lastRun !== periodKey && today.getDate() >= r.dayOfMonth);
    if (due.length) {
      const generated = due.map(r => ({
        id: 'tx-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        tanggal: `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(r.dayOfMonth).padStart(2, '0')}`,
        keterangan: r.keterangan + ' (Otomatis)', jenis: r.jenis, kategori: r.kategori, wallet: r.wallet,
        nominal: r.nominal, createdAt: new Date().toISOString(), recurringId: r.id
      }));
      workingTxs = [...generated, ...workingTxs];
      changed = true;
      const newRecurring = recurring.map(r => due.find(d => d.id === r.id) ? { ...r, lastRun: periodKey } : r);
      setRecurring(newRecurring);
      LS.set('kas_recurring', newRecurring);
      notify(`${due.length} transaksi berulang otomatis dicatat.`);
    }

    if (changed) {
      setTxs(workingTxs);
      LS.set('kas_txs', workingTxs);
    }
    // eslint-disable-next-line
  }, []);

  const persist = useCallback((newTxs) => {
    setTxs(newTxs);
    LS.set('kas_txs', newTxs);
    if (syncUrl) syncToCloud(newTxs, syncUrl);
  }, [syncUrl, syncMode]);

  const syncToCloud = async (dataTxs, url) => {
    if (!url) return;
    setIsSyncing(true);
    try {
      await fetch(url, { method: 'POST', body: JSON.stringify({ txs: dataTxs, mode: syncMode }) });
    } catch(e) { console.warn('Cloud sync failed', e); }
    finally { setIsSyncing(false); }
  };

  const pullFromCloud = async (url) => {
    setIsSyncing(true);
    try {
      const res = await fetch(url);
      const data = await res.json();
      if(data.txs) {
        const normalized = data.txs.map(t => ({ ...t, kategori: t.kategori || 'Lainnya', wallet: t.wallet || (wallets[0] || 'Tunai'), nominal: Number(t.nominal) }));
        setTxs(normalized);
        LS.set('kas_txs', normalized);
        notify('Data tersinkronisasi dari Cloud!');
      }
    } catch(e) { notify('Gagal menarik data.', 'err'); }
    finally { setIsSyncing(false); }
  };

  const handleSetSync = () => {
    if(!tempUrl.trim()) return notify('URL tidak boleh kosong', 'err');
    setSyncUrl(tempUrl.trim());
    LS.set('kas_syncUrl', tempUrl.trim());
    pullFromCloud(tempUrl.trim());
    setModal(null);
  };

  const disconnectSync = () => {
    if(!window.confirm('Putuskan koneksi ke Google Sheets? (Data lokal tetap aman)')) return;
    setSyncUrl('');
    LS.set('kas_syncUrl', '');
    setModal(null);
    notify('Beralih ke mode lokal murni.');
  };

  const openForm = (tx = null) => {
    if(tx) {
      setEditingId(tx.id);
      setForm({ ...tx });
    } else {
      setEditingId(null);
      setForm({ ...emptyForm, tanggal: new Date().toISOString().split('T')[0] });
    }
    setModal('form');
  };

  const saveTx = (e) => {
    e.preventDefault();
    if(!form.keterangan.trim() || !form.nominal) return notify('Keterangan & Nominal wajib diisi', 'err');

    const kategoriFinal = (form.kategori || '').trim() || 'Lainnya';
    const txData = {
      ...form,
      kategori: kategoriFinal,
      nominal: Number(form.nominal),
      createdAt: editingId ? form.createdAt : new Date().toISOString()
    };

    if (!categories.includes(kategoriFinal)) {
      const newCategories = [...categories, kategoriFinal];
      setCategories(newCategories);
      LS.set('kas_categories', newCategories);
    }

    let newTxs;
    if(editingId) {
      newTxs = txs.map(t => t.id === editingId ? { ...t, ...txData } : t);
      notify('Transaksi diperbarui!');
    } else {
      txData.id = 'tx-' + Date.now().toString(36);
      newTxs = [txData, ...txs];
      notify('Transaksi dicatat!');
    }

    persist(newTxs);
    setModal(null);
  };

  const deleteTx = (id) => {
    const idx = txs.findIndex(t => t.id === id);
    if (idx === -1) return;
    const deletedTx = txs[idx];
    persist(txs.filter(t => t.id !== id));
    notify('Transaksi dihapus.', 'ok', {
      label: 'URUNGKAN',
      onClick: () => {
        setTxs(curr => {
          const restored = [...curr];
          restored.splice(idx, 0, deletedTx);
          LS.set('kas_txs', restored);
          if (syncUrl) syncToCloud(restored, syncUrl);
          return restored;
        });
        setToast(null);
      }
    });
  };

  const exportCSV = () => {
    const headers = ['Tanggal', 'Keterangan', 'Jenis', 'Kategori', 'Dompet', 'Nominal'];
    const rows = txs.map(t => [t.tanggal, `"${t.keterangan.replace(/"/g, '""')}"`, t.jenis, t.kategori || '', t.wallet || '', t.nominal]);
    const csvStr = [headers, ...rows].map(e => e.join(",")).join("\n");
    const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `Laporan_Kas_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
    notify('Laporan CSV diunduh!');
  };

  const importCSVFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const rows = parseCSV(ev.target.result);
        const newItems = rows.filter(r => r.length >= 6 && r[0]).map(r => ({
          id: 'tx-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          tanggal: r[0], keterangan: r[1],
          jenis: r[2] === 'Pemasukan' ? 'Pemasukan' : 'Pengeluaran',
          kategori: r[3] || 'Lainnya', wallet: r[4] || (wallets[0] || 'Tunai'),
          nominal: Number(r[5]) || 0, createdAt: new Date().toISOString()
        }));
        if (!newItems.length) { notify('Tidak ada baris valid ditemukan di CSV.', 'err'); return; }
        persist([...newItems, ...txs]);
        notify(`${newItems.length} transaksi diimpor dari CSV.`);
      } catch(err) { notify('Gagal membaca file CSV.', 'err'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const exportJSON = () => {
    const backup = { txs, categories, wallets, recurring, syncMode, exportedAt: new Date().toISOString(), version: 2 };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `KasLite_Backup_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    notify('Backup JSON diunduh!');
  };

  const importJSONFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!window.confirm('Impor akan MENGGANTI semua data lokal saat ini (transaksi, dompet, kategori, template berulang). Lanjutkan?')) return;
        const newTxs = Array.isArray(data.txs) ? data.txs : [];
        const newCategories = (Array.isArray(data.categories) && data.categories.length) ? data.categories : DEFAULT_CATEGORIES;
        const newWallets = (Array.isArray(data.wallets) && data.wallets.length) ? data.wallets : DEFAULT_WALLETS;
        const newRecurring = Array.isArray(data.recurring) ? data.recurring : [];
        setTxs(newTxs); LS.set('kas_txs', newTxs);
        setCategories(newCategories); LS.set('kas_categories', newCategories);
        setWallets(newWallets); LS.set('kas_wallets', newWallets);
        setRecurring(newRecurring); LS.set('kas_recurring', newRecurring);
        notify('Data berhasil diimpor!');
      } catch(err) { notify('File JSON tidak valid.', 'err'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const addWallet = () => {
    const name = newWalletName.trim();
    if (!name) return notify('Nama dompet wajib diisi', 'err');
    if (wallets.includes(name)) return notify('Dompet sudah ada', 'err');
    const newWallets = [...wallets, name];
    setWallets(newWallets); LS.set('kas_wallets', newWallets);
    setNewWalletName('');
    notify('Dompet ditambahkan.');
  };

  const removeWallet = (name) => {
    if (wallets.length <= 1) return notify('Minimal harus ada 1 dompet', 'err');
    if (txs.some(t => t.wallet === name)) return notify('Tidak bisa hapus, masih dipakai transaksi', 'err');
    const newWallets = wallets.filter(w => w !== name);
    setWallets(newWallets); LS.set('kas_wallets', newWallets);
    notify('Dompet dihapus.');
  };

  const addRecurring = (e) => {
    e.preventDefault();
    if (!recurringForm.keterangan.trim() || !recurringForm.nominal) return notify('Keterangan & Nominal wajib diisi', 'err');
    const item = {
      id: 'rec-' + Date.now().toString(36),
      keterangan: recurringForm.keterangan.trim(),
      jenis: recurringForm.jenis,
      kategori: (recurringForm.kategori || '').trim() || 'Lainnya',
      wallet: recurringForm.wallet,
      nominal: Number(recurringForm.nominal),
      dayOfMonth: Math.min(28, Math.max(1, Number(recurringForm.dayOfMonth) || 1)),
      lastRun: null
    };
    const newRecurring = [...recurring, item];
    setRecurring(newRecurring); LS.set('kas_recurring', newRecurring);
    setRecurringForm(emptyRecurringForm);
    notify('Transaksi berulang ditambahkan.');
  };

  const removeRecurring = (id) => {
    const newRecurring = recurring.filter(r => r.id !== id);
    setRecurring(newRecurring); LS.set('kas_recurring', newRecurring);
    notify('Template dihapus.');
  };

  const setNewPin = (pin) => {
    if (!pin || pin.length < 4) return notify('PIN minimal 4 digit', 'err');
    const h = simpleHash(pin);
    setPinHash(h); LS.set('kas_pin', h);
    notify('PIN diaktifkan.');
  };
  const removePin = () => {
    if (!window.confirm('Nonaktifkan kunci PIN?')) return;
    setPinHash(null); LS.set('kas_pin', null);
    notify('PIN dinonaktifkan.');
  };
  const trySubmitPin = (e) => {
    e.preventDefault();
    if (simpleHash(pinInput) === pinHash) { setUnlocked(true); setPinInput(''); setPinError(false); }
    else { setPinError(true); setPinInput(''); }
  };

  const filteredTxs = useMemo(() => {
    const q = search.toLowerCase();
    let list = txs.filter(t => {
      const matchType = filterType === 'Semua' || t.jenis === filterType;
      const matchWallet = filterWallet === 'Semua' || t.wallet === filterWallet;
      const matchSearch = t.keterangan.toLowerCase().includes(q) || t.tanggal.includes(q) || (t.kategori || '').toLowerCase().includes(q);
      const matchDate = (!dateFrom || t.tanggal >= dateFrom) && (!dateTo || t.tanggal <= dateTo);
      return matchType && matchWallet && matchSearch && matchDate;
    });
    list = [...list].sort((a, b) => {
      const diff = sortBy === 'nominal' ? (a.nominal - b.nominal) : (new Date(a.tanggal) - new Date(b.tanggal));
      return sortDir === 'asc' ? diff : -diff;
    });
    return list;
  }, [txs, search, filterType, filterWallet, dateFrom, dateTo, sortBy, sortDir]);

  const totalMasuk = useMemo(() => txs.filter(t => t.jenis === 'Pemasukan').reduce((s, t) => s + t.nominal, 0), [txs]);
  const totalKeluar = useMemo(() => txs.filter(t => t.jenis === 'Pengeluaran').reduce((s, t) => s + t.nominal, 0), [txs]);
  const saldo = totalMasuk - totalKeluar;

  const saldoPerWallet = useMemo(() => {
    const map = {};
    wallets.forEach(w => { map[w] = 0; });
    txs.forEach(t => {
      if (map[t.wallet] === undefined) map[t.wallet] = 0;
      map[t.wallet] += t.jenis === 'Pemasukan' ? t.nominal : -t.nominal;
    });
    return map;
  }, [txs, wallets]);

  const monthlyTrend = useMemo(() => {
    const map = {};
    txs.forEach(t => {
      const key = t.tanggal.slice(0, 7);
      if (!map[key]) map[key] = { masuk: 0, keluar: 0 };
      if (t.jenis === 'Pemasukan') map[key].masuk += t.nominal; else map[key].keluar += t.nominal;
    });
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      const agg = map[key] || { masuk: 0, keluar: 0 };
      months.push({ key, label: d.toLocaleDateString('id-ID', { month: 'short' }), masuk: agg.masuk, keluar: agg.keluar });
    }
    return months;
  }, [txs]);

  const categoryBreakdown = useMemo(() => {
    const now = new Date();
    const periodKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const map = {};
    txs.filter(t => t.jenis === 'Pengeluaran' && t.tanggal.startsWith(periodKey)).forEach(t => {
      const k = t.kategori || 'Lainnya';
      map[k] = (map[k] || 0) + t.nominal;
    });
    const total = Object.values(map).reduce((a, b) => a + b, 0);
    return Object.entries(map)
      .map(([kategori, nominal]) => ({ kategori, nominal, pct: total ? (nominal / total * 100) : 0 }))
      .sort((a, b) => b.nominal - a.nominal);
  }, [txs]);

  const monthCompare = useMemo(() => {
    const now = new Date();
    const curKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const prevD = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const prevKey = `${prevD.getFullYear()}-${String(prevD.getMonth() + 1).padStart(2, '0')}`;
    const sum = (key, jenis) => txs.filter(t => t.tanggal.startsWith(key) && t.jenis === jenis).reduce((s, t) => s + t.nominal, 0);
    return {
      cur: { masuk: sum(curKey, 'Pemasukan'), keluar: sum(curKey, 'Pengeluaran') },
      prev: { masuk: sum(prevKey, 'Pemasukan'), keluar: sum(prevKey, 'Pengeluaran') }
    };
  }, [txs]);

  const advFilterActive = filterWallet !== 'Semua' || dateFrom || dateTo || sortBy !== 'tanggal' || sortDir !== 'desc';

  // ── Layar kunci PIN ──
  if (pinHash && !unlocked) {
    return html`
      <div class="lock-screen">
        <${I.Lock} style=${{ width:36, height:36, color:'var(--muted)' }} />
        <h2 style=${{ fontSize:18, fontWeight:700 }}>KasLite Terkunci</h2>
        <form onSubmit=${trySubmitPin} style=${{ display:'flex', flexDirection:'column', gap:12, width:'100%', maxWidth:280 }}>
          <input type="password" inputmode="numeric" class="input-field" style=${{ textAlign:'center', fontSize:20, letterSpacing:8 }}
            placeholder="••••" value=${pinInput} onInput=${e => { setPinInput(e.target.value); setPinError(false); }} autofocus />
          ${pinError && html`<div style=${{ color:'var(--expense)', fontSize:12, textAlign:'center' }}>PIN salah, coba lagi.</div>`}
          <button type="submit" class="btn-primary" style=${{ justifyContent:'center' }}>Buka</button>
        </form>
      </div>
    `;
  }

  return html`
    <div style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>

      <datalist id="kategori-datalist">${categories.map(c => html`<option value=${c} />`)}</datalist>

      <!-- HEADER -->
      <header style=${{ background:'var(--card)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:30, padding:'12px 20px' }}>
        <div style=${{ maxWidth:800, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', gap:16 }}>
          <h1 style=${{ fontSize:18, fontWeight:700, letterSpacing:'-0.5px' }}>
            Kas<span style=${{color:'var(--accent)'}}>Lite</span>
          </h1>

          <div style=${{ flex:1, position:'relative', maxWidth: 300 }}>
            <${I.Search} style=${{ width:16, height:16, position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)' }} />
            <input class="input-field" style=${{ paddingLeft:36, height:38, fontSize:13 }}
              placeholder="Cari transaksi..." value=${search} onInput=${e => setSearch(e.target.value)} />
          </div>

          <div style=${{ display:'flex', gap:6 }}>
            <button onClick=${() => setModal('settings')} class="btn-ghost" title="Pengaturan">
              <${I.Settings} style=${{width:16,height:16}} />

                <div style=${{ padding:14, background:'rgba(16,185,129,0.1)', borderRadius:8, color:'var(--accent)', fontSize:13, fontWeight:500, display:'flex', gap:8 }}>
                  <${I.Check} style=${{width:18,height:18,flexShrink:0}} />
                  Terhubung ke Google Sheets. Data tersinkronisasi otomatis setiap ada perubahan lokal.
                </div>

                <div>
                  <label style=${{ fontSize:12, fontWeight:600, display:'block', marginBottom:6 }}>Mode Sinkronisasi</label>
                  <div style=${{ display:'flex', gap:8, background:'var(--paper2)', padding:4, borderRadius:8, border:'1px solid var(--border)' }}>
                    ${[['overwrite','Timpa Total'],['merge','Gabung (Aman)']].map(pair => html`
                      <button key=${pair[0]} onClick=${() => { setSyncMode(pair[0]); LS.set('kas_syncMode', pair[0]); }}
                        style=${{ flex:1, padding:'8px', fontSize:12, fontWeight:600, borderRadius:6,
                                  background: syncMode === pair[0] ? 'var(--card)' : 'transparent',
                                  color: syncMode === pair[0] ? 'var(--ink)' : 'var(--muted)' }}>${pair[1]}</button>
                    `)}
                  </div>
                  <p style=${{ fontSize:11, color:'var(--muted)', marginTop:6 }}>"Gabung" menggabungkan data berdasarkan ID — lebih aman kalau Sheet juga diedit manual. Pastikan skrip GAS backend sudah versi terbaru (lihat panduan di bawah).</p>
                </div>

                <button type="button" onClick=${() => setShowGasInfo(!showGasInfo)} class="btn-ghost" style=${{ border:'none', padding:0, color:'#3b82f6', fontSize:13 }}>
                  ${showGasInfo ? 'Sembunyikan Panduan Backend' : 'Lihat Panduan Setup Backend (GAS)'}
                </button>
                ${showGasInfo && html`
                  <div style=${{ padding:12, background:'var(--paper2)', borderRadius:8, border:'1px solid var(--border)' }}>
                    <ol style=${{ fontSize:12, color:'var(--muted)', paddingLeft:16, margin:0, lineHeight:1.6 }}>
                      <li>Buka spreadsheet baru, klik Ekstensi > Apps Script.</li>
                      <li>Salin kode di bawah (ganti seluruh isi editor), terapkan sebagai Web App (Anyone).</li>
                      <li>Deploy ulang jika sebelumnya sudah pernah setup, agar kolom Kategori & Dompet ikut tersimpan.</li>
                    </ol>
                    <pre style=${{ background:'#000', color:'#4ade80', padding:10, borderRadius:6, fontSize:10, marginTop:10, overflowX:'auto' }}>${GAS_TEMPLATE}</pre>
                  </div>
                `}

                <button onClick=${disconnectSync} class="btn-ghost" style=${{ width:'100%', justifyContent:'center', color:'var(--expense)', borderColor:'var(--expense)' }}>
                  <${I.CloudOff} style=${{width:16,height:16}} /> Putuskan Koneksi
                </button>
              ` : html`
                <div>
                  <button type="button" onClick=${() => setShowGasInfo(!showGasInfo)} class="btn-ghost" style=${{ border:'none', padding:0, color:'#3b82f6', fontSize:13, marginBottom:12 }}>
                    ${showGasInfo ? 'Sembunyikan Panduan Backend' : 'Lihat Panduan Setup Backend (GAS)'}
                  </button>
                  ${showGasInfo && html`
                    <div style=${{ padding:12, background:'var(--paper2)', borderRadius:8, border:'1px solid var(--border)', marginBottom:16 }}>
                      <ol style=${{ fontSize:12, color:'var(--muted)', paddingLeft:16, margin:0, lineHeight:1.6 }}>
                        <li>Buka spreadsheet baru, klik Ekstensi > Apps Script.</li>
                        <li>Salin kode di bawah, terapkan sebagai Web App (Anyone).</li>
                        <li>Masukkan URL Web App ke form di bawah ini.</li>
                      </ol>
                      <pre style=${{ background:'#000', color:'#4ade80', padding:10, borderRadius:6, fontSize:10, marginTop:10, overflowX:'auto' }}>${GAS_TEMPLATE}</pre>
                    </div>
                  `}

                  <label style=${{ fontSize:12, fontWeight:600, display:'block', marginBottom:6 }}>Web App URL</label>
                  <input type="url" class="input-field" placeholder="https://script.google.com/macros/s/..."
                    value=${tempUrl} onInput=${e => setTempUrl(e.target.value)} />
                </div>

                <button onClick=${handleSetSync} class="btn-primary" style=${{ width:'100%', justifyContent:'center' }}>
                  <${I.Cloud} style=${{width:16,height:16}} /> Sambungkan & Tarik Data
                </button>
              `}
            </div>
          </div>
        </div>
      `}

      ${toast && html`<${Toast} msg=${toast.msg} type=${toast.type} action=${toast.action} />`}
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
